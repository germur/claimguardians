<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Form registration</title></head>
<body data-form-blueprint>
  <!-- Complete schema for React forms. Netlify detects this at deploy time. -->
  <form name="claim-review" method="POST" data-netlify="true" netlify-honeypot="bot-field" action="/free-claim-review/thank-you/" hidden>
    <input name="form-name" value="claim-review">
    <input name="bot-field"><input name="lead_type"><input name="full_name">
    <input name="first_name"><input name="last_name"><input name="email"><input name="phone">
    <input name="damage_type"><input name="loss_date"><input name="property_type"><input name="state">
    <input name="technical_source"><input name="discovery_source">
    <input name="landing_page"><input name="form_page">
    <input name="zip_code"><input name="claim_status"><input name="preferred_language">
    <textarea name="description"></textarea>
  </form>
</body>
</html>
